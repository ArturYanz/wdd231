<link rel="stylesheet" href="styles/normalize.css">
<link rel="stylesheet" href="styles/cinescope.css">



<script type="module" src="scripts/cinescope.js"></script>

<body>
    <header>
        <nav class="navbar">
    
            <div class="brand">
                <img src="images/logo-pop.webp" alt="CineScope logo" class="logo" width="44" height="49">
                <span class="site-name">CineScope</span>
            </div>
    
            <button class="menu-btn" aria-label="Open navigation menu">☰</button>
    
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="movies.html">Movies</a></li>
                <li><a class="current" href="about.html" aria-current="page">About</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h1>Contact</h1>

            <form action="form-action.html" method="get">
                <label>
                    Name:
                    <input type="text" name="name" required>
                </label>

                <label>
                    Email:
                    <input type="email" name="email" required>
                </label>

                <label>
                    Favorite Genre:
                    <select name="genre" required>
                        <option value="">Select One</option>
                        <option value="Action">Action</option>
                        <option value="Comedy">Comedy</option>
                        <option value="Drama">Drama</option>
                        <option value="Sci-Fi">Sci-Fi</option>
                        <option value="Horror">Horror</option>
                    </select>
                </label>

                <fieldset>
                    <legend><strong>What are you interested in?</strong></legend>

                    <label><input type="checkbox" name="interest" value="new-releases"> New Releases</label>
                    <label><input type="checkbox" name="interest" value="classics"> Classics</label>
                    <label><input type="checkbox" name="interest" value="recommendations"> Recommendations</label>
                </fieldset>

                <label>
                    How often do you watch movies?
                    <select name="frequency" required>
                        <option value="">Select One</option>
                        <option value="casual">Casual (1-2 per week)</option>
                        <option value="regular">Regular (3-5 per week)</option>
                        <option value="cinescoper">CineScoper 😎 (almost every day)</option>
                    </select>
                </label>

                <label>
                    Tell us your favorite movie:
                    <textarea name="favoriteMovie" rows="3"></textarea>
                </label>

                <button type="submit">Share My Info</button>
            </form>
        </section>
    </main>

    <footer>
        <div class="info">
            <p><strong>CineScope&copy;</strong></p>
            <p>Av. Matta 3845</p>
            <p>info@cinescope.com</p>
            <p>+56 9 4328 9874</p>
        </div>
        <div class="social">
    
            <a href="https://www.facebook.com" target="_blank"><img src="../images/facebook.svg" alt="Facebook profile link"
                    width="16" height="16"></a>
            <a href="https://www.linkedin.com" target="_blank"><img src="../images/linkedin.svg"
                    alt="Linked In profile link" width="16" height="16"></a>
            <a href="https://www.twitter.com" target="_blank"><img src="../images/twitter-x.svg" alt="Twitter profile link"
                    width="16" height="16"></a>
        </div>
        <div class="personal">
            <p>WDD231 Class Project</p>
            <p>Arturo Yánez</p>
            <p>&copy;<span id="currentyear"></span> CineScope</p>
            <p id="lastModified"></p>
            <a href="references.html" target="_blank">References</a>
        </div>
    </footer>
</body>
